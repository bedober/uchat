name: chatvault
description: ChatVault secure messaging client for Android and iOS.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4
  dio: ^5.8.0+1
  socket_io_client: ^3.0.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.4
  flutter_webrtc: ^0.12.11
  cryptography: ^2.7.0
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  file_picker: ^9.0.2
  permission_handler: ^11.4.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.7
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
