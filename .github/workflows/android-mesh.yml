name: Android Mesh debug build
on:
  push:
    paths:
      - "native-android/**"
      - "api/**"
      - ".github/workflows/android-mesh.yml"
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/android-mesh.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Validate Vercel API JavaScript
        run: node --check "api/v1/[...route].js"
      - name: Build debug APK
        working-directory: native-android
        run: gradle testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: uchat-mesh-debug-apk
          path: native-android/app/build/outputs/apk/debug/app-debug.apk